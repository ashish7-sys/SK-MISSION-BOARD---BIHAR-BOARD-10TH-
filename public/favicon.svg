<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle with Neon Aura -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="8" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#06b6d4" stroke-width="6" opacity="0.9" />

  <!-- Outer Neon Ring Glow -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>

  <!-- Golden Crown -->
  <path d="M 180 210 L 210 150 L 256 185 L 302 150 L 332 210 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="210" cy="142" r="8" fill="#fde047"/>
  <circle cx="256" cy="177" r="8" fill="#fde047"/>
  <circle cx="302" cy="142" r="8" fill="#fde047"/>

  <!-- Open Cyan Book -->
  <path d="M 160 250 Q 256 230 256 260 L 256 360 Q 160 330 160 360 Z" fill="url(#cyanGrad)"/>
  <path d="M 352 250 Q 256 230 256 260 L 256 360 Q 352 330 352 360 Z" fill="url(#cyanGrad)"/>

  <!-- SK Text Monogram -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="52" fill="#fde047" text-anchor="middle" letter-spacing="4">
    SK BOARD
  </text>
</svg>
